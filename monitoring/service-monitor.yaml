apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: gitops-dashboard-backend
  namespace: monitoring
spec:
  namespaceSelector:
    matchNames: [gitops-dev]
  selector:
    matchLabels:
      app: gitops-dashboard-backend
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
