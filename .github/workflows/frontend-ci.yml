name: Frontend CI

on:
  pull_request:
    paths: ["app/**", "components/**", "package*.json", "Dockerfile", ".github/workflows/frontend-ci.yml"]
  push:
    branches: [main]
    paths: ["app/**", "components/**", "package*.json", "Dockerfile", ".github/workflows/frontend-ci.yml"]

permissions:
  contents: read
  id-token: write

env:
  AZURE_CORE_OUTPUT: none
  IMAGE_NAME: gitops-dashboard-frontend

jobs:
  test-build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Azure login with OIDC
        if: github.event_name == 'push'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Sign in to ACR
        if: github.event_name == 'push'
        run: az acr login --name "${{ vars.ACR_NAME }}"
      - uses: docker/setup-buildx-action@v4
      - name: Build and push immutable image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ vars.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
